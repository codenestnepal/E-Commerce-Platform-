<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Shop - NILE</title>
    <meta name="description" content="Explore our handpicked collection of high-quality items.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="eComstyle.css">
    <link rel="stylesheet" href="shop.css">
    <style>
      .filter-toolbar {
        max-width: 1200px;
        margin: 0 auto 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        padding: 0 20px;
      }
      .filter-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip-btn {
        background: #262424;
        color: #9a9591;
        border: 1px solid #3a3737;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .chip-btn:hover, .chip-btn.active {
        background: #ff6347;
        color: #1d1c1c;
        border-color: #ff6347;
        font-weight: 700;
      }
      .sort-select {
        background: #262424;
        color: #f2efe9;
        border: 1px solid #3a3737;
        padding: 8px 14px;
        border-radius: 6px;
        outline: none;
        font-size: 13px;
      }
      .catalog-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .dynamic-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 24px;
        margin-bottom: 60px;
      }
      .shop-card {
        background: #262424;
        border: 1px solid #3a3737;
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s, border-color 0.2s;
        cursor: pointer;
        position: relative;
      }
      .shop-card:hover {
        transform: translateY(-4px);
        border-color: #ff6347;
      }
      .card-img-wrap {
        width: 100%;
        height: 200px;
        border-radius: 8px;
        overflow: hidden;
        background: #1d1c1c;
        margin-bottom: 14px;
      }
      .card-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .shop-card h4 {
        color: #f2efe9;
        font-size: 16px;
        margin: 0 0 6px;
      }
      .shop-card .card-cat {
        font-size: 11px;
        text-transform: uppercase;
        color: #ff6347;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .shop-card .price {
        color: #ff6347;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 14px;
      }
      .card-actions {
        margin-top: auto;
        display: flex;
        gap: 8px;
      }
      .btn-add {
        flex: 1;
        background: #ff6347;
        color: #1d1c1c;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        font-weight: 700;
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-heart {
        width: 36px;
        height: 36px;
        background: #1d1c1c;
        border: 1px solid #3a3737;
        color: #9a9591;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-heart.active {
        color: #ff6347;
      }
    </style>
</head>
<body>

  <header>
    <nav class="nav-bar">
      <div class="lo-go"><a href="index.html">NILE<span>STORE</span></a></div>
      <ul class="nav-link">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" style="color:tomato;">Shop</a></li>
        <li><a href="categories.html">Categories</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <div class="search-container">
        <input type="text" placeholder="Search" id="SearchQuery">
        <button onclick="searchbar()"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <div class="wishlist"><a href="wishlist.html" title="Wishlist"><i class="fa-solid fa-heart"></i><span class="nav-count wishlist-count">0</span></a></div>
      <div class="cart"><a href="cart.html" title="Shopping Cart"><i class="fa-solid fa-cart-shopping"></i><span class="nav-count cart-count">0</span></a></div>
      <button class="login-btn" onclick="window.location.href='login.html'">Login / Sign Up</button>
    </nav>
  </header>

  <section class="shop-section" id="shop">
    <div class="shop-header">
      <h2 class="shop-title">Discover Our Products</h2>
      <p class="shop-subtitle">Handpicked collection of top-rated items curated for you</p>
      <div class="title-underline"></div>
    </div>

    <!-- Filter & Sort Toolbar -->
    <div class="filter-toolbar">
      <div class="filter-chips">
        <button class="chip-btn active" onclick="setCategoryFilter('all', this)">All</button>
        <button class="chip-btn" onclick="setCategoryFilter('Electronics', this)">Electronics</button>
        <button class="chip-btn" onclick="setCategoryFilter('Fashion', this)">Fashion</button>
        <button class="chip-btn" onclick="setCategoryFilter('Home & Living', this)">Home & Living</button>
        <button class="chip-btn" onclick="setCategoryFilter('Beauty', this)">Beauty</button>
        <button class="chip-btn" onclick="setCategoryFilter('Sports', this)">Sports</button>
      </div>

      <select class="sort-select" id="sortSelect" onchange="changeSort(this.value)">
        <option value="featured">Sort: Featured</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </div>

    <!-- Dynamic Grid -->
    <div class="catalog-container">
      <div class="dynamic-grid" id="catalogGrid">
        <!-- Rendered by JavaScript -->
      </div>
    </div>
  </section>

  <script src="eComjs.js"></script>
  <script>
    let allProducts = [];
    let activeCategory = "all";
    let activeSort = "featured";
    let activeSearch = "";

    async function fetchCatalog() {
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#9a9591;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p>Loading products...</p></div>';

      try {
        const res = await fetch(`${API_BASE}/products`);
        const data = await res.json().catch(() => ({}));
        if (data.products && Array.isArray(data.products)) {
          allProducts = data.products;
        }
      } catch (e) {}

      // Check URL query parameters
      const params = new URLSearchParams(window.location.search);
      const urlCat = params.get("category");
      const urlSearch = params.get("search");

      if (urlCat) {
        activeCategory = urlCat;
        document.querySelectorAll(".chip-btn").forEach(btn => {
          if (btn.textContent.trim().toLowerCase() === urlCat.toLowerCase()) {
            document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
          }
        });
      }

      if (urlSearch) {
        activeSearch = urlSearch;
        const sInput = document.getElementById("SearchQuery");
        if (sInput) sInput.value = urlSearch;
      }

      renderCatalog();
    }

    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");

      let filtered = allProducts.slice();

      if (activeCategory !== "all") {
        filtered = filtered.filter(p => p.category && p.category.toLowerCase() === activeCategory.toLowerCase());
      }

      if (activeSearch) {
        const q = activeSearch.toLowerCase();
        filtered = filtered.filter(p =>
          (p.name && p.name.toLowerCase().includes(q)) ||
          (p.category && p.category.toLowerCase().includes(q)) ||
          (p.description && p.description.toLowerCase().includes(q))
        );
      }

      if (activeSort === "price-low") filtered.sort((a, b) => a.price - b.price);
      else if (activeSort === "price-high") filtered.sort((a, b) => b.price - a.price);
      else if (activeSort === "name") filtered.sort((a, b) => a.name.localeCompare(b.name));

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding:60px 20px; color:#9a9591;">
            <i class="fa-solid fa-box-open fa-3x" style="color:#ff6347; margin-bottom:12px;"></i>
            <h3 style="color:#f2efe9;">No Products Found</h3>
            <p>Try adjusting your search or category filter.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(prod => {
        const id = prod._id || prod.id || prod.name;
        const img = (prod.images && prod.images[0]) || prod.image || "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600";
        const isHearted = NileStore.isWishlisted(prod.name);

        return `
          <div class="shop-card" onclick="window.location.href='product.html?id=${encodeURIComponent(id)}&name=${encodeURIComponent(prod.name)}&price=${prod.price}'">
            <div class="card-img-wrap">
              <img src="${img}" alt="${prod.name}" onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600'">
            </div>
            <div class="card-cat">${prod.category || "General"}</div>
            <h4>${prod.name}</h4>
            <div class="price">$${Number(prod.price).toFixed(2)}</div>
            <div class="card-actions">
              <button class="btn-add" onclick="event.stopPropagation(); NileStore.addToCart({ id: '${id}', name: '${prod.name.replace(/'/g, "\\'")}', price: ${prod.price}, image: '${img}', category: '${prod.category}' })">
                Add to Cart <i class="fa-solid fa-plus"></i>
              </button>
              <button class="btn-heart ${isHearted ? 'active' : ''}" onclick="event.stopPropagation(); toggleHeart(this, { id: '${id}', name: '${prod.name.replace(/'/g, "\\'")}', price: ${prod.price}, image: '${img}', category: '${prod.category}' })" title="Wishlist">
                <i class="fa-${isHearted ? 'solid' : 'regular'} fa-heart"></i>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function toggleHeart(btn, prod) {
      const isSaved = NileStore.toggleWishlist(prod);
      btn.classList.toggle("active", isSaved);
      btn.innerHTML = `<i class="fa-${isSaved ? 'solid' : 'regular'} fa-heart"></i>`;
    }

    function setCategoryFilter(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderCatalog();
    }

    function changeSort(val) {
      activeSort = val;
      renderCatalog();
    }

    window.filterCatalogBySearch = function(query) {
      activeSearch = query;
      renderCatalog();
    };

    document.addEventListener("DOMContentLoaded", () => {
      fetchCatalog();
    });
  </script>
</body>
</html>
