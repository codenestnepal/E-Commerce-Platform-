<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nile - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

    <div class="brand-section">
        <div class="brand-content">
            <a href="index.html" class="brand-logo">NILE</a>
            <h2>Everything You Need, Delivered.</h2>
            <p>
                Sign in to access your orders, wishlist,
                personalized recommendations, and exclusive deals.
            </p>
        </div>
    </div>

    <div class="login-section">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Sign in to continue shopping</p>

            <form>
                <input type="email" placeholder="Email Address" required autocomplete="username">

                <input type="password" placeholder="Password" required autocomplete="current-password">

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">
                    Login
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button type="button" class="google-btn">
                    <i class="fa-brands fa-google"></i> Continue with Google
                </button>

                <p class="signup-link">
                    New to Nile?
                    <a href="Signup.html">Create Account</a>
                </p>
            </form>
        </div>
    </div>

</div>

</body>
</html>
