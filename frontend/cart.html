<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="eComstyle.css">
    <link rel="stylesheet" href="cart.css">

    <script src="https://kit.fontawesome.com/acc7b38144.js" crossorigin="anonymous"></script>
</head>
<body>

<header>
  <nav class="nav-bar">
    <!-- 1.) Company logo -->
   <div class="lo-go"><a href="index.html">NILE<span>STORE</span></a></div>

    <!-- 2.) Navigation Section -->
    <ul class="nav-link">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="categories.html">Categories</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <!-- 3.) Search bar -->
    <div class="search-container">
      <input type="text" placeholder="Search" id="SearchQuery">
      <button onclick="searchbar()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <!-- 4.) Cart Icon -->
    <div class="wishlist"><a href="wishlist.html" title="Wishlist"><i class="fa-solid fa-heart"></i></a></div>
      <div class="cart"><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a></div>

    <!-- 5.) Login/Sign up button -->
    <button class="login-btn" onclick="window.location.href='login.html'">Login / Sign Up</button>
  </nav>
</header>

<section class="cart-page">

    <div class="cart-header">
        <h1>Shopping Cart</h1>
        <p>Review your items and proceed to checkout.</p>
    </div>

    <div class="cart-container">

        <!-- Cart Items -->
        <div class="cart-items" id="cartItems">
            <p>Loading your cart...</p>
        </div>

        <!-- Order Summary -->
        <div class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="summarySubtotal">$0.00</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="summaryShipping">$0.00</span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span id="summaryTotal">$0.00</span>
            </div>

            <input type="text" placeholder="Enter Coupon Code">

            <button class="coupon-btn">
                Apply Coupon
            </button>

            <button class="checkout-btn">
                Proceed to Checkout
            </button>

            <button class="continue-btn">
                Continue Shopping
            </button>

        </div>

    </div>

</section>

    <script src="utilities.js"></script>

    <script src="apiService.js"></script>

    <script src="auth.js"></script>

    <script src="products.js"></script>

    <script src="cart.js"></script>

    <script src="eComjs.js"></script>

    <script src="https://kit.fontawesome.com/acc7b38144.js" crossorigin="anonymous"></script>

  <script src="navbar.js"></script>
</body>
</html>
