<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nile - Create Account</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

<div class="container">

    <div class="brand-section">
        <div class="brand-content">
            <h1>NILE</h1>
            <h2>Join the Nile Community</h2>
            <p>
                Create your account to enjoy personalized shopping,
                faster checkout, order tracking, wishlist management,
                and exclusive member offers.
            </p>
        </div>
    </div>

    <div class="signup-section">

        <div class="signup-card">

            <h2>Create Account</h2>
            <p>Start your shopping journey today</p>

            <form>

                <div class="name-row">
                    <input type="text" placeholder="First Name" required>
                    <input type="text" placeholder="Last Name" required>
                </div>

                <input type="email" placeholder="Email Address" required>

                <input type="password" placeholder="Password" required>

                <input type="password" placeholder="Confirm Password" required>

                <label class="terms">
                    <input type="checkbox" required>
                    <span>
                        I agree to the Terms & Conditions and Privacy Policy
                    </span>
                </label>

                <button type="submit">
                    Create Account
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button type="button" class="google-btn">
                    Continue with Google
                </button>

                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </form>

        </div>

    </div>

</div>

</body>
</html>
